server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA calls the API with same-origin relative URLs; forward them to the gateway
    # (no CORS, no hard-coded localhost:8080 in the bundle).
    # Resolve "gateway" per request (Docker DNS) instead of at startup: the gateway also
    # proxies to this container, so neither has to be up first, and restarts don't leave
    # a stale upstream IP behind.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    location ~ ^/(api/|recommend|chatbot|behavior/) {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
    }

    # Hashed build assets can be cached forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
