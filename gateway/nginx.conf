worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    # Custom log format for tracking microservices performance and trace routing
    log_format gateway_log '$remote_addr - $remote_user [$time_local] "$request" '
                           'status=$status bytes=$body_bytes_sent '
                           'rt=$request_time urt=$upstream_response_time';

    access_log /dev/stdout gateway_log;

    # Browser traffic reaches the gateway through the frontend container, so every user
    # would share that container's IP: take the client IP from the X-Real-IP header the
    # frontend sets (trusted only from the Docker networks).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    # Rate limiting: 10 requests per second per client IP (burst 20)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    server {
        listen 8080;
        server_name localhost;

        # Apply Rate Limiting globally across the APIs
        limit_req zone=api_limit burst=20 nodelay;

        # Cấu hình CORS chung
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        # Loại bỏ header CORS từ Backend để tránh trùng lặp
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        # Proxy Headers chuẩn
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tăng timeout cho AI responses
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_pass http://frontend:80;
        }

        # Khớp các API Microservices
        # Admin & Staff endpoints routing
        location /api/v1/admin/users {
            proxy_pass http://user-service:8001/api/v1/admin/users;
        }

        # Back office product endpoints (product + typed create: books, electronics, ...)
        location ~ ^/api/v1/staff/(products|books|electronics|fashion|home-living|sports-outdoors|beauty-health|toys-games|automotive|food-grocery|office-supplies)(/|$) {
            proxy_pass http://product-service:8002;
        }

        location /api/v1/staff/orders {
            proxy_pass http://order-service:8004/api/v1/staff/orders;
        }

        location /api/v1/staff/shipping {
            proxy_pass http://shipping-service:8006/api/v1/staff/shipping;
        }

        location /api/v1/staff/categories {
            proxy_pass http://catalog-service:8008/api/v1/categories;
        }

        # Khớp các API Microservices
        location /api/v1/users {
            proxy_pass http://user-service:8001/api/v1/users;
        }
        location /api/v1/auth {
            proxy_pass http://user-service:8001/api/v1/auth;
        }
        location /api/v1/products {
            proxy_pass http://product-service:8002/api/v1/products;
        }
        location /api/v1/categories {
            proxy_pass http://catalog-service:8008/api/v1/categories;
        }
        location /api/v1/comments {
            proxy_pass http://comment-rate-service:8009/api/v1/comments;
        }
        location /api/v1/cart {
            proxy_pass http://cart-service:8003/api/v1/cart;
        }
        location /api/v1/orders {
            proxy_pass http://order-service:8004/api/v1/orders;
        }
        location /api/v1/payment {
            proxy_pass http://payment-service:8005/api/v1/payment;
        }

        # Unknown API paths: answer here. Falling through to `location /` sent them to the
        # frontend, which proxies /api back to the gateway: an endless loop.
        location /api/ {
            default_type application/json;
            return 404 '{"error": "Not found", "code": 404}';
        }
        
        # AI Service
        location /recommend {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                return 204;
            }
            proxy_pass http://ai-service:8007/recommend;
        }
        location /chatbot {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                return 204;
            }
            proxy_pass http://ai-service:8007/chatbot;
        }
        location /behavior/track {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                return 204;
            }
            proxy_pass http://ai-service:8007/behavior/track;
        }
    }
}
