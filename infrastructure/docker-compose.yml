# Project name -> containers are named ecommerce-<service>-1
name: ecommerce

services:

  # ── API Gateway ───────────────────────────────────
  gateway:
    build: ../gateway
    ports: ["8080:8080"]
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - shipping-service
      - ai-service
      - catalog-service
      - comment-rate-service

  # ── Domain services ───────────────────────────────
  user-service:
    build: ../user-service
    networks: [default, shared-infra]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - DB_HOST=mysql-container
      - DB_PORT=3306
    ports: ["8001:8001"]
    env_file: ../user-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  product-service:
    build: ../product-service
    networks: [default, shared-infra]
    environment:
      - RABBITMQ_HOST=rabbitmq
    ports: ["8002:8002"]
    env_file: ../product-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  cart-service:
    build: ../cart-service
    networks: [default, shared-infra]
    environment:
      - RABBITMQ_HOST=rabbitmq
    ports: ["8003:8003"]
    env_file: ../cart-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  order-service:
    build: ../order-service
    networks: [default, shared-infra]
    environment:
      - RABBITMQ_HOST=rabbitmq
    ports: ["8004:8004"]
    env_file: ../order-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  payment-service:
    build: ../payment-service
    networks: [default, shared-infra]
    environment:
      - RABBITMQ_HOST=rabbitmq
    ports: ["8005:8005"]
    env_file: ../payment-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  shipping-service:
    build: ../shipping-service
    networks: [default, shared-infra]
    environment:
      - RABBITMQ_HOST=rabbitmq
    ports: ["8006:8006"]
    env_file: ../shipping-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-service:
    build: ../ai-service
    networks: [default, shared-infra]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - NEO4J_URI=bolt://neo4j:7687
    ports: ["8007:8007"]
    env_file: ../ai-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../ai-service/data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8007
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  catalog-service:
    build: ../catalog-service
    networks: [default, shared-infra]
    environment:
      - RABBITMQ_HOST=rabbitmq
    ports: ["8008:8008"]
    env_file: ../catalog-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  comment-rate-service:
    build: ../comment-rate-service
    networks: [default, shared-infra]
    environment:
      - RABBITMQ_HOST=rabbitmq
    ports: ["8009:8009"]
    env_file: ../comment-rate-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8009"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ../frontend
    ports: ["3000:80"]
    # The SPA uses same-origin URLs; its nginx proxies /api, /recommend, /chatbot
    # and /behavior to the gateway (see frontend/nginx.conf).

  # ── Message Broker ────────────────────────────────
  # RabbitMQ, MySQL and Neo4j are NOT started here: the project uses the shared
  # containers (also used by other projects) on the external `shared-infra` network
  # and reaches them by container name. One-time setup:
  #   docker network create shared-infra
  #   docker network connect shared-infra rabbitmq   (and mysql-container, neo4j, redis)
  # The chatbot LLM is the shared `ollama` container (GPU):
  #   docker run -d --name ollama --gpus all --network shared-infra -p 11434:11434 \
  #     -v ollama_data:/root/.ollama ollama/ollama
  #   docker exec ollama ollama pull qwen2.5:3b
  # PostgreSQL is the native install on the host, reached via host.docker.internal:5432
  # (DB_HOST in each service's .env).

  # ── Observability & Monitoring ─────────────────────
  prometheus:
    image: prom/prometheus:v2.49.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - shipping-service
      - ai-service
      - catalog-service
      - comment-rate-service

  loki:
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.3
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
      - loki

networks:
  shared-infra:
    external: true
